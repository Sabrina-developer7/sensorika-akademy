<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish — Sensorika Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container" style="max-width: 450px;">
        <h1 class="display-4 text-center mt-5 mb-4 fw-bold">Kirish</h1>

        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="floatingInput" placeholder="Username">
            <label for="floatingInput">Username</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Parol">
            <label for="floatingPassword">Parol</label>
        </div>

        <div id="errorMsg" class="alert alert-danger d-none" role="alert">
            Username yoki parol noto'g'ri!
        </div>

        <button id="sendBtn" class="btn btn-primary w-100 py-2 fw-semibold fs-5">Kirish</button>

        <p class="text-center mt-3 text-muted">
            Akkountingiz yo'qmi? <a href="register.html" class="text-success fw-semibold">Ro'yxatdan o'tish</a>
        </p>
    </div>

    <script src="database.js"></script>
    <script src="signIn.js"></script>
</body>
</html>
