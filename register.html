<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish — Sensorika Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container" style="max-width: 450px;">
        <h1 class="display-4 text-center mt-5 mb-4 fw-bold">Ro'yxatdan o'tish</h1>

        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="regName" placeholder="Ismingiz">
            <label for="regName">Ism Familiya</label>
        </div>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="regUsername" placeholder="Username">
            <label for="regUsername">Username</label>
        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="regPassword" placeholder="Parol">
            <label for="regPassword">Parol</label>
        </div>

        <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>
        <div id="successMsg" class="alert alert-success d-none" role="alert">
            Muvaffaqiyatli ro'yxatdan o'tdingiz! Kirilmoqda...
        </div>

        <button id="registerBtn" class="btn btn-success w-100 py-2 fw-semibold fs-5">Ro'yxatdan o'tish</button>

        <p class="text-center mt-3 text-muted">
            Akkountingiz bormi? <a href="singIn.html" class="text-primary fw-semibold">Kirish</a>
        </p>
    </div>

    <script src="database.js"></script>
    <script src="register.js"></script>
</body>
</html>
